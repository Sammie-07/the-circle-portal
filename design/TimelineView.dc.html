<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0D0D0D; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    a { color: #C9A227; } a:hover { color: #E0B94A; }
  </style>
</helmet>
<div style="width: 1120px; box-sizing: border-box; background: #0D0D0D; color: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 44px 48px 56px;">

  <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 34px;">
    <div style="font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #C9A227;">Progress &middot; growth timeline</div>
    <h1 class="serif" style="margin: 0; font-size: 34px; font-weight: 400; color: #FFFFFF;">Samuel Akinwande</h1>
    <div style="font-size: 14px; color: #888888;">Each metric tracked from Aug &rarr; Sep 2026</div>
  </div>

  <div style="background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 16px; padding: 12px 28px;">

    <!-- column key -->
    <div style="display: flex; align-items: center; gap: 20px; padding: 12px 0 16px; border-bottom: 1px solid #222;">
      <div style="width: 190px;"></div>
      <div style="flex: 1; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #555;">
        <span>Aug</span><span>Sep</span>
      </div>
      <div style="width: 92px; text-align: right; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #555;">Change</div>
    </div>

    <!-- track rows -->
    <div style="display: flex; flex-direction: column;">

      <!-- Income -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0; border-bottom: 1px solid #1D1D1D;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Monthly income</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">$8,500</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #C9A227);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">$12,300</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #C9A227;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1 9 9 1 9Z"/></svg>45%</span></div>
      </div>

      <!-- Credit -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0; border-bottom: 1px solid #1D1D1D;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Credit score</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">648</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #C9A227);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">674</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #C9A227;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1 9 9 1 9Z"/></svg>+26</span></div>
      </div>

      <!-- Debt -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0; border-bottom: 1px solid #1D1D1D;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Total debt</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">$42,000</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #5bbd68);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">$36,500</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #5bbd68;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 9 1 1 9 1Z"/></svg>13%</span></div>
      </div>

      <!-- Investments -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0; border-bottom: 1px solid #1D1D1D;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Investments value</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">$12,000</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #C9A227);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">$18,500</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #C9A227;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1 9 9 1 9Z"/></svg>54%</span></div>
      </div>

      <!-- Properties / LLC / VA combined as counts -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0; border-bottom: 1px solid #1D1D1D;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Properties owned</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">1</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #C9A227);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">2</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #C9A227;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 1 9 9 1 9Z"/></svg>+1</span></div>
      </div>

      <!-- Hours -->
      <div style="display: flex; align-items: center; gap: 20px; padding: 22px 0;">
        <div style="width: 190px; font-size: 14px; color: #AAAAAA;">Hours worked / week</div>
        <div style="flex: 1; display: flex; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 7px;"><span style="font-size: 13px; color: #777;">55</span><span style="width: 11px; height: 11px; border-radius: 999px; background: #3A3A3A; border: 2px solid #555;"></span></div>
          <div style="flex: 1; height: 2px; margin: 0 4px 18px; background: linear-gradient(90deg, #444, #5bbd68);"></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px;"><span class="serif" style="font-size: 17px; color: #FFF;">48</span><span style="width: 12px; height: 12px; border-radius: 999px; background: #5bbd68;"></span></div>
        </div>
        <div style="width: 92px; text-align: right;"><span style="display: inline-flex; align-items: center; gap: 4px; color: #5bbd68; background: rgba(91,189,104,0.12); font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px;"><svg width="8" height="8" viewBox="0 0 10 10" fill="currentColor"><path d="M5 9 1 1 9 1Z"/></svg>-7h</span></div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
